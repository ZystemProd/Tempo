name: Build and release

# Raising __version__ in tempo/__init__.py on main publishes that version automatically:
# GitHub tags it (v1.2.3), builds the Windows and Mac apps plus the instrument-splitter
# add-on, and attaches them to a new release. A release published by hand on GitHub
# is built the same way. "Run workflow" builds and tests without releasing.
on:
  push:
    branches: [main]
    paths: ['tempo/__init__.py', '.github/workflows/release.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      runtime: ${{ steps.v.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fingerprint of everything built into the apps besides Tempo's own code. Releases with
          # the same fingerprint can be installed as a quick code-only update.
          echo "runtime=$(cat requirements.txt run_tempo.py .github/workflows/release.yml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(python3 -c "import re; print(re.search(r'[\"\']([0-9][^\"\']*)[\"\']', open('tempo/__init__.py').read()).group(1))")
          T="v$V"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && ! gh api "repos/${{ github.repository }}/git/ref/tags/$T" >/dev/null 2>&1; then
            echo "Version $V has no release yet: publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building $T without publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Tempo-Windows.zip
          - os: macos-latest
            asset: Tempo-Mac.zip
          - os: macos-15-intel
            asset: Tempo-Mac-Intel.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pylibrb pyinstaller
      - name: Check the studio engine
        run: python -c "from tempo.stretch import rubberband_available as ok, engine_problem as why; print('Rubber Band R3 ready:', ok(), why())"
      - name: Build app
        run: |
          echo "${{ needs.version.outputs.runtime }}" > tempo_runtime.txt
          python -c "import tempo; print(tempo.__version__)" > tempo_version.txt
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --windowed --name Tempo \
            --collect-all imageio_ffmpeg --collect-all pylibrb --collect-data certifi \
            --exclude-module torch --exclude-module demucs \
            --add-data "tempo_runtime.txt${SEP}." --add-data "tempo_version.txt${SEP}." \
            run_tempo.py
      - name: Test quick code updates in the built app
        run: |
          EXE=dist/Tempo/Tempo.exe; [ "$RUNNER_OS" = "macOS" ] && EXE=dist/Tempo.app/Contents/MacOS/Tempo
          export TEMPO_DATA_DIR="$PWD/test-data"
          [ "$RUNNER_OS" = "Windows" ] && export TEMPO_DATA_DIR="$(cygpath -w "$PWD/test-data")"
          BUILT=$(tr -d '\r\n' < tempo_version.txt)
          mkdir -p test-data/code/9.9.9 && cp -r tempo test-data/code/9.9.9/
          echo "__version__ = '9.9.9'" > test-data/code/9.9.9/tempo/__init__.py
          check() {
            python -c "import subprocess,sys; subprocess.run([sys.argv[1], '--print-version', 'ver.txt'], timeout=120)" "$EXE"
            echo "$1 -> $(cat ver.txt)"; grep -q "^$2 " ver.txt
          }
          check "no update" "$BUILT"
          echo '{"version": "9.9.9", "runtime": "${{ needs.version.outputs.runtime }}"}' > test-data/code/active.json
          check "code update for these built-in parts" "9.9.9"
          echo '{"version": "9.9.9", "runtime": "something-else"}' > test-data/code/active.json
          check "code update for other built-in parts is ignored" "$BUILT"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Tempo -DestinationPath ${{ matrix.asset }}
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Tempo.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  splitter:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Tempo-Splitter-Windows.zip
            exe: dist/TempoSplitter/TempoSplitter.exe
            flags: --noconsole
          - os: macos-latest
            asset: Tempo-Splitter-Mac.zip
            exe: dist/TempoSplitter/TempoSplitter
          - os: macos-15-intel
            asset: Tempo-Splitter-Mac-Intel.zip
            exe: dist/TempoSplitter/TempoSplitter
            constraints: constraints-mac-intel.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          C=""
          if [ -n "${{ matrix.constraints }}" ]; then C="-c ${{ matrix.constraints }}"; fi
          python -m pip install numpy imageio-ffmpeg -r requirements-splitter.txt pyinstaller $C
      - name: Make a test song
        run: |
          python -c "
          import numpy as np; from tempo.audio import write_wav
          sr=44100; t=np.arange(sr*8)/sr
          x=0.3*np.sin(2*np.pi*220*t)+0.2*np.sin(2*np.pi*660*t)*(t%0.5<0.1)+0.05*np.random.randn(len(t))
          write_wav('test-song.wav', np.stack([x,x],1).astype('float32'), sr)"
      - name: Test splitting (Python)
        run: |
          python splitter.py test-song.wav out-py htdemucs progress-py.txt
          tail -2 progress-py.txt
          test -f out-py/vocals.wav && test -f out-py/drums.wav
      - name: Build add-on
        run: >
          pyinstaller --noconfirm --name TempoSplitter ${{ matrix.flags }}
          --collect-all imageio_ffmpeg --collect-data certifi
          --collect-all demucs --collect-all dora --collect-all julius --collect-all openunmix
          --collect-all lameenc --collect-data omegaconf --collect-submodules torchaudio
          --exclude-module PySide6 --exclude-module pylibrb
          splitter.py
      - name: Test splitting (built add-on)
        env:
          TEMPO_DEBUG: '1'
        run: |
          python -c "
          import subprocess, sys
          try:
              r = subprocess.run([sys.argv[1], 'test-song.wav', 'out-app', 'htdemucs', 'progress-app.txt'], timeout=600, capture_output=True, text=True)
              print('exit', r.returncode); print(r.stdout[-3000:]); print(r.stderr[-3000:])
          except subprocess.TimeoutExpired as e:
              print('TIMED OUT')
          " "${{ matrix.exe }}"
          cat progress-app.txt || true
          test -f out-app/vocals.wav && test -f out-app/drums.wav
          grep -q "STAGE 5" progress-app.txt
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TempoSplitter -DestinationPath ${{ matrix.asset }}
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/TempoSplitter ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: splitter-${{ matrix.asset }}
          path: ${{ matrix.asset }}

  source:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the Python version
        run: |
          mkdir -p pkg/Tempo
          git archive HEAD | tar -x -C pkg/Tempo
          rm -rf pkg/Tempo/.github pkg/Tempo/.gitignore pkg/Tempo/.gitattributes pkg/Tempo/README.md pkg/Tempo/splitter.py
          chmod +x pkg/Tempo/*.command
          cd pkg && zip -r -X ../Tempo-source.zip Tempo
      - name: Package the quick code update
        run: |
          mkdir -p code && git archive HEAD tempo | tar -x -C code
          (cd code && zip -r -X ../Tempo-code.zip tempo)
          V=$(python3 -c "import re; print(re.search(r'[\"\']([0-9][^\"\']*)[\"\']', open('tempo/__init__.py').read()).group(1))")
          echo "{\"version\": \"$V\", \"runtime\": \"${{ needs.version.outputs.runtime }}\"}" > Tempo-update.json
          cat Tempo-update.json
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-source.zip
          path: Tempo-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-code.zip
          path: Tempo-code.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-update.json
          path: Tempo-update.json

  release:
    needs: [version, app, source]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Tempo-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Tempo ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: out/*

  release-splitter:
    needs: [version, release, splitter]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: splitter-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: out/*
