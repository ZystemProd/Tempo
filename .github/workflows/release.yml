name: Build and release

# Publishing a release on GitHub (Releases > Draft a new release) builds the
# Windows and Mac apps and attaches them to it. "Run workflow" builds without releasing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Tempo-Windows.zip
          - os: macos-latest
            asset: Tempo-Mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pylibrb pyinstaller
      - name: Check the studio engine
        run: python -c "from tempo.stretch import rubberband_available as ok, engine_problem as why; print('Rubber Band R3 ready:', ok(), why())"
      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name Tempo
          --collect-all imageio_ffmpeg --collect-all pylibrb --collect-data certifi
          run_tempo.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Tempo -DestinationPath ${{ matrix.asset }}
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Tempo.app ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the Python version
        run: |
          mkdir -p pkg/Tempo
          git archive HEAD | tar -x -C pkg/Tempo
          rm -rf pkg/Tempo/.github pkg/Tempo/.gitignore pkg/Tempo/.gitattributes pkg/Tempo/README.md
          chmod +x pkg/Tempo/*.command
          cd pkg && zip -r -X ../Tempo-source.zip Tempo
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-source.zip
          path: Tempo-source.zip

  release:
    needs: [app, source]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: out/*
