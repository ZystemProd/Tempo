name: Screenshot
# Renders the window offscreen at laptop sizes so layout changes can be checked.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 libegl1 libxkbcommon0 fonts-inter || sudo apt-get install -y -q libportaudio2 libegl1 libxkbcommon0
          python -m pip install -q -r requirements.txt
          python tools/screenshot.py screens
      - name: Publish to the ci-screens branch
        run: |
          cd screens
          git init -q -b ci-screens
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add -A && git commit -q -m "Screenshots for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens
